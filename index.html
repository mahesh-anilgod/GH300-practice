<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GH-300 Quiz V2</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>GH-300 Quiz <span>V2</span></h1><p>Study, resume, bookmark and practice mock exams</p></div><button class="ghost" id="theme">Dark mode</button></header>
<section id="home" class="card"><div id="resumeBox" class="notice hidden"></div><h2>Choose practice mode</h2><div class="grid"><button data-size="100">Full 100</button><button data-size="50">Mock 50</button><button data-size="25">Mock 25</button><button id="bookmarked">Bookmarks</button></div><label><input id="shuffle" type="checkbox" checked> Shuffle questions</label><h2>Attempt history</h2><div id="history"></div></section>
<section id="quiz" class="card hidden"><div class="row"><b id="progress"></b><b id="score"></b></div><div class="bar"><i id="bar"></i></div><div class="row"><span id="kind" class="pill"></span><button id="bookmark" class="star ghost">☆ Bookmark</button></div><h2 id="question"></h2><form id="options"></form><div id="feedback" class="feedback hidden"></div><div class="row"><button id="submit">Submit</button><button id="next" class="hidden">Next</button><button id="quit" class="ghost">Save & exit</button></div></section>
<section id="finish" class="card hidden"><h2>Attempt complete</h2><div id="final" class="big"></div><p id="summary"></p><div class="grid"><button id="reviewWrong">Review incorrect</button><button id="newAttempt">New attempt</button></div></section></main><script src="questions.js"></script><script src="app.js"></script></body></html>
